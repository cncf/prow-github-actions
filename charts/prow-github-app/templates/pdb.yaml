{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "prow-github-app.fullname" . }}
  labels: {{- include "prow-github-app.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "prow-github-app.selectorLabels" . | nindent 6 }}
{{- end }}
