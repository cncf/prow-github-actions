apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prow-github-app.fullname" . }}
  labels: {{- include "prow-github-app.labels" . | nindent 4 }}
data:
  PROW_COMMANDS: {{ .Values.prow.commands | quote }}
  PROW_JOBS: {{ .Values.prow.jobs | quote }}
  PROW_MERGE_METHOD: {{ .Values.prow.mergeMethod | quote }}
  PROW_CONFIG: {{ .Values.prow.config | quote }}
  PROW_DRY_RUN: {{ .Values.prow.dryRun | toString | quote }}
  {{- if .Values.github.apiUrl }}
  GITHUB_API_URL: {{ .Values.github.apiUrl | quote }}
  {{- end }}
