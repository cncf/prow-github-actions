{{- if not .Values.github.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prow-github-app.fullname" . }}
  labels: {{- include "prow-github-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  appId: {{ required "github.appId is required (or set github.existingSecret)" .Values.github.appId | quote }}
  privateKey: {{ required "github.privateKey is required (or set github.existingSecret)" .Values.github.privateKey | quote }}
  webhookSecret: {{ required "github.webhookSecret is required (or set github.existingSecret)" .Values.github.webhookSecret | quote }}
{{- end }}
