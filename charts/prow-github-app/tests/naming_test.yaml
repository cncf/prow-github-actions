suite: resource names
templates:
  - cronjob.yaml
values:
  - ./values/creds.yaml
tests:
  - it: preserves the CronJob name for a short release
    release:
      name: single
    asserts:
      - equal: {path: metadata.name, value: single-prow-github-app-jobs}
  - it: preserves a CronJob name at the 52-character limit
    release:
      name: abcdefghijklmnopqrstuvwxyz01234
    asserts:
      - equal: {path: metadata.name, value: abcdefghijklmnopqrstuvwxyz01234-prow-github-app-jobs}
  - it: keeps a long release's CronJob name within the API limit
    release:
      name: platform-team-prow-automation-production-eu-west
    asserts:
      - matchRegex: {path: metadata.name, pattern: '^[a-z0-9]([-a-z0-9]{0,50}[a-z0-9])?$'}
      - matchRegex: {path: metadata.name, pattern: -jobs$}
  - it: bounds a maximum-length release name that already contains the chart name
    release:
      name: prow-github-app-abcdefghijklmnopqrstuvwxyz01234567890
    asserts:
      - matchRegex: {path: metadata.name, pattern: '^[a-z0-9]([-a-z0-9]{0,50}[a-z0-9])?$'}
      - matchRegex: {path: metadata.name, pattern: -jobs$}
  - it: trims a hyphen at the truncation boundary of a fullname override
    set:
      fullnameOverride: abcdefghijklmnopqrstuvwxyz01234567890123456789-override
    asserts:
      - equal: {path: metadata.name, value: abcdefghijklmnopqrstuvwxyz01234567890123456789-jobs}
