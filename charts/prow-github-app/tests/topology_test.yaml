suite: topology
templates:
  - deployment.yaml
  - pdb.yaml
  - secret.yaml
  - cronjob.yaml
values:
  - ./values/creds.yaml
tests:
  - it: one replica recreates and has no pdb
    template: deployment.yaml
    asserts:
      - equal: {path: spec.replicas, value: 1}
      - equal: {path: spec.strategy.type, value: Recreate}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: REDIS_URL}
          any: true
  - it: one replica renders no pdb
    template: pdb.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: several replicas roll, carry REDIS_URL and a pdb
    set:
      replicaCount: 3
      redis.url: redis://r:6379
    template: deployment.yaml
    asserts:
      - equal: {path: spec.replicas, value: 3}
      - isNull: {path: spec.strategy}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: REDIS_URL, value: redis://r:6379}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROW_REPLICAS, value: '3'}
  - it: several replicas render a pdb with minAvailable 1
    set:
      replicaCount: 3
      redis.url: redis://r:6379
    template: pdb.yaml
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: spec.minAvailable, value: 1}
  - it: redis.existingSecret wins over redis.url
    set:
      replicaCount: 2
      redis.url: redis://ignored
      redis.existingSecret: my-redis
      redis.existingSecretKey: uri
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom: {secretKeyRef: {name: my-redis, key: uri}}
  - it: inline credentials render a Secret the env reads
    template: secret.yaml
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: stringData.appId, value: '42'}
  - it: github.existingSecret suppresses the Secret and is what the env reads
    set:
      github.existingSecret: mine
      github.appId: ''
      github.privateKey: ''
      github.webhookSecret: ''
    template: secret.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: the env reads github.existingSecret
    set:
      github.existingSecret: mine
      github.appId: ''
      github.privateKey: ''
      github.webhookSecret: ''
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_APP_ID
            valueFrom: {secretKeyRef: {name: mine, key: appId}}
  - it: the cronjob runs the cron entry point on the schedule, never concurrently
    template: cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: '0 * * * *'
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [dist-server/index.js, cron]
  - it: cronjob.enabled false renders nothing
    set:
      cronjob.enabled: false
    template: cronjob.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: the shutdown grace is fifteen seconds under the pod's, after the preStop sleep and the drain
    set:
      terminationGracePeriodSeconds: 45
    template: deployment.yaml
    asserts:
      - equal: {path: spec.template.spec.terminationGracePeriodSeconds, value: 45}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROW_SHUTDOWN_GRACE_MS, value: '30000'}
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: [sleep, '5']
  - it: by default the pod has 75 s to stop and the server waits 60 s for in-flight events
    template: deployment.yaml
    asserts:
      - equal: {path: spec.template.spec.terminationGracePeriodSeconds, value: 75}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROW_SHUTDOWN_GRACE_MS, value: '60000'}
  - it: refuses a grace too short for the preStop sleep, the drain and closing the stores
    set:
      terminationGracePeriodSeconds: 15
    template: deployment.yaml
    asserts:
      - failedTemplate: {}
  - it: a cron run is killed after cronjob.activeDeadlineSeconds
    template: cronjob.yaml
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 3000}
  - it: cronjob.activeDeadlineSeconds is configurable
    set:
      cronjob.activeDeadlineSeconds: 600
    template: cronjob.yaml
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 600}
  - it: the cron pods are the jobs component
    template: cronjob.yaml
    asserts:
      - equal: {path: 'spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]', value: jobs}
  - it: the Deployment selects only the server pods
    template: deployment.yaml
    asserts:
      - equal: {path: 'spec.selector.matchLabels["app.kubernetes.io/component"]', value: server}
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: server}
  - it: the pdb selects only the server pods, never a cron run
    set:
      replicaCount: 2
      redis.url: redis://r:6379
    template: pdb.yaml
    asserts:
      - equal: {path: 'spec.selector.matchLabels["app.kubernetes.io/component"]', value: server}
  - it: affinity is passed to the pod spec
    set:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
  - it: nodeSelector is passed to the pod spec
    set:
      nodeSelector: {disktype: ssd}
    template: deployment.yaml
    asserts:
      - equal: {path: spec.template.spec.nodeSelector, value: {disktype: ssd}}
  - it: podAnnotations are added next to the checksum annotations
    set:
      podAnnotations: {prometheus.io/scrape: 'true'}
    template: deployment.yaml
    asserts:
      - equal: {path: 'spec.template.metadata.annotations["prometheus.io/scrape"]', value: 'true'}
      - isNotNull: {path: 'spec.template.metadata.annotations["checksum/config"]'}
  - it: podLabels are added next to the server selector labels
    set:
      podLabels: {team: platform}
    template: deployment.yaml
    asserts:
      - equal: {path: spec.template.metadata.labels.team, value: platform}
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: server}
  - it: tolerations are passed to the pod spec
    set:
      tolerations:
        - {key: dedicated, operator: Equal, value: prow, effect: NoSchedule}
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content: {key: dedicated, operator: Equal, value: prow, effect: NoSchedule}
  - it: topologySpreadConstraints are passed to the pod spec
    set:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway}
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content: {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway}
