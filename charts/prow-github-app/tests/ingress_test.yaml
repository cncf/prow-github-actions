suite: ingress
templates: [ingress.yaml]
values: [./values/creds.yaml]
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments: {count: 0}
  - it: the documented webhook install routes /webhook exactly to the service's http port
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.hosts:
        - host: prow.example.com
          paths: [{path: /webhook, pathType: Exact}]
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: Ingress}
      - isAPIVersion: {of: networking.k8s.io/v1}
      - equal: {path: metadata.name, value: RELEASE-NAME-prow-github-app}
      - equal: {path: spec.ingressClassName, value: nginx}
      - notExists: {path: spec.tls}
      - notExists: {path: metadata.annotations}
      - lengthEqual: {path: spec.rules, count: 1}
      - equal: {path: 'spec.rules[0].host', value: prow.example.com}
      - equal:
          path: spec.rules[0].http.paths
          value:
            - path: /webhook
              pathType: Exact
              backend:
                service:
                  name: RELEASE-NAME-prow-github-app
                  port: {name: http}
  - it: a path without pathType defaults to Prefix
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: prow.example.com
          paths: [{path: /}]
    asserts:
      - equal: {path: 'spec.rules[0].http.paths[0].pathType', value: Prefix}
      - notExists: {path: spec.ingressClassName}
  - it: tls and annotations pass through, one rule per host
    set:
      ingress.enabled: true
      ingress.annotations: {cert-manager.io/cluster-issuer: letsencrypt}
      ingress.tls: [{secretName: prow-tls, hosts: [prow.example.com]}]
      ingress.hosts:
        - host: prow.example.com
          paths: [{path: /webhook, pathType: Exact}]
        - host: prow-alt.example.com
          paths: [{path: /webhook, pathType: Exact}]
    asserts:
      - equal:
          path: metadata.annotations
          value: {cert-manager.io/cluster-issuer: letsencrypt}
      - equal: {path: spec.tls, value: [{secretName: prow-tls, hosts: [prow.example.com]}]}
      - lengthEqual: {path: spec.rules, count: 2}
      - equal: {path: 'spec.rules[1].host', value: prow-alt.example.com}
