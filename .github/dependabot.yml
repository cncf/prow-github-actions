version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the runtime in action.yml (runs.using: node24); bump both together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native port; typescript-eslint supports < 6.1 only.
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
