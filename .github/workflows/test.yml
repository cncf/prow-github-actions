name: Build and test code
on:
  push:
    branches: [main]
  pull_request:
  # lets a maintainer re-run the main baseline on demand
  workflow_dispatch:
  # tide merges with github.token don't trigger push runs on main;
  # the daily schedule keeps a build-test baseline on the merged result.
  # GitHub emails scheduled-run failures to whoever last edited the cron line.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

# One run per pull request: a newer push supersedes its pending run. The PR
# number keys the group, so same-named branches across forks never collide.
# Every non-PR run (main push, schedule, dispatch) falls back to its own
# run_id and is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # the App server's Redis-backed stores (__tests__/adapters/app/redis.test.ts) run against a real server
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          # shellcheck disable=SC2016
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("### Coverage (`vitest --coverage`)\n\n| Metric | % | Covered |\n|---|---|---|");
            for (const k of ["statements","branches","functions","lines"]) console.log(row(k));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify committed dist/ matches source
        run: |
          npm run pack
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run pack' and commit the result."
            git --no-pager diff --stat dist/
            exit 1
          fi

  # The whole suite with every file's tests in a random order (npm run
  # test:shuffle, see docs/contributing.md "Test order"). A test that leaks
  # state into its neighbour passes in source order by luck; the seed Vitest
  # prints with a failure repeats the order locally (--sequence.seed=<n>).
  shuffle:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run test:shuffle

  # Mutation checks over the merge-decision code (npm run test:mutation:nightly,
  # stryker.nightly.config.mjs): a surviving mutant means a pull request could
  # merge or be held for the wrong reason, and line coverage cannot see it.
  # Too slow for every push, so it runs on the daily schedule and on demand;
  # it fails below the break score in the nightly config.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:nightly
      - name: Mutation summary
        if: always()
        run: |
          [ -f reports/mutation/report.json ] || exit 0
          # shellcheck disable=SC2016
          node -e '
            const { files } = require("./reports/mutation/report.json");
            const tally = {};
            for (const [file, { mutants }] of Object.entries(files)) {
              const t = tally[file] = { killed: 0, survived: 0, timeout: 0, noCoverage: 0, other: 0 };
              for (const { status } of mutants) {
                if (status === "Killed") t.killed++;
                else if (status === "Survived") t.survived++;
                else if (status === "Timeout") t.timeout++;
                else if (status === "NoCoverage") t.noCoverage++;
                else t.other++;
              }
            }
            const score = t => { const d = t.killed + t.timeout + t.survived + t.noCoverage; return d ? (100 * (t.killed + t.timeout) / d).toFixed(2) : "n/a"; };
            console.log("### Mutation score (`npm run test:mutation:nightly`)\n\n| File | Score | Killed | Timeout | Survived | No coverage |\n|---|---|---|---|---|---|");
            for (const [file, t] of Object.entries(tally)) console.log(`| ${file} | ${score(t)}% | ${t.killed} | ${t.timeout} | ${t.survived} | ${t.noCoverage} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ github.sha }}
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  # End-to-end coverage: the bundle acceptance suite run against a
  # source-mapped bundle (npm run test:coverage:e2e). Reported separately from
  # the unit figure on purpose (see docs/contributing.md); it is a record, not
  # a gate, so it is not a required check. Runs alongside build-test rather
  # than inside it because the suite takes several minutes on its own.
  e2e-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run test:coverage:e2e
      - name: E2E coverage summary
        if: always()
        run: |
          [ -f coverage-e2e/coverage-summary.json ] || exit 0
          # shellcheck disable=SC2016
          node -e '
            const t = require("./coverage-e2e/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("### E2E coverage (`npm run test:coverage:e2e`)\n\n| Metric | % | Covered |\n|---|---|---|");
            for (const k of ["statements","branches","functions","lines"]) console.log(row(k));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-e2e-${{ github.sha }}
          path: coverage-e2e/
          retention-days: 14
          if-no-files-found: ignore

  # the Helm chart: lint on every run, and install the two topologies into a kind cluster against an
  # image built from this very commit (loaded into kind, never pushed)
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Lint
        run: ct lint --config ct.yaml --all
      - name: Unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.2.1 --verify=false
          helm unittest charts/prow-github-app
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - name: Build the image from this commit and load it into kind
        run: |
          docker build -t prow-github-app:ci .
          kind load docker-image prow-github-app:ci --name chart-testing
      - name: Install (one replica)
        run: |
          helm install single charts/prow-github-app -f charts/prow-github-app/ci/single-values.yaml \
            --set image.repository=prow-github-app --set image.tag=ci --wait --timeout 120s
          kubectl rollout status deploy/single-prow-github-app --timeout=60s
          kubectl run curl --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- -sf http://single-prow-github-app:8080/readyz
      - name: Install (two replicas, external Redis)
        run: |
          kubectl apply -f charts/prow-github-app/ci/redis.yaml
          kubectl rollout status deploy/ci-redis --timeout=60s
          helm install ha charts/prow-github-app -f charts/prow-github-app/ci/ha-external-redis-values.yaml \
            --set image.repository=prow-github-app --set image.tag=ci --wait --timeout 120s
          kubectl rollout status deploy/ha-prow-github-app --timeout=60s
          test "$(kubectl get deploy ha-prow-github-app -o jsonpath='{.status.readyReplicas}')" = 2
          kubectl get pdb ha-prow-github-app
          kubectl logs deploy/ha-prow-github-app --all-containers | grep -q '"redis: connected"'
      - name: A signed ping reaches the HA service
        run: |
          body='{"zen":"x","hook_id":1}'
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac ci-secret | sed 's/.* //')"
          code=$(kubectl run curl --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- -s -o /dev/null -w '%{http_code}' \
            -X POST http://ha-prow-github-app:8080/webhook -H 'x-github-delivery: ci-1' -H 'x-github-event: ping' -H "x-hub-signature-256: $sig" -d "$body" | head -c 3)
          test "$code" = 200
